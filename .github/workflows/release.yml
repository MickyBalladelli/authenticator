name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x build.sh package.sh scripts/update-cask.sh
          VERSION="$VERSION" ./package.sh
          ./scripts/update-cask.sh "dist/MacAuthenticator-${VERSION}.zip"
          echo "Cask preview:" 
          cat Casks/mac-authenticator.rb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Mac Authenticator ${{ steps.version.outputs.version }}
          body: |
            ## Install with Homebrew

            ```bash
            brew tap MickyBalladelli/authenticator https://github.com/MickyBalladelli/authenticator
            brew install --cask mac-authenticator
            ```

            After this release, merge the updated `Casks/mac-authenticator.rb` (version + sha256) from the workflow artifact, or run:

            ```bash
            ./scripts/update-cask.sh dist/MacAuthenticator-${{ steps.version.outputs.version }}.zip
            ```
          files: |
            dist/MacAuthenticator-${{ steps.version.outputs.version }}.zip
            dist/MacAuthenticator-${{ steps.version.outputs.version }}.zip.sha256
            Casks/mac-authenticator.rb
          generate_release_notes: true
